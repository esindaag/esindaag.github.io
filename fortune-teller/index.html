<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"><meta name="theme-color" content="#130f1c"><title>Fortune Teller | ED Labs</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;color:#f4e5cf;background:radial-gradient(ellipse at 50% 42%,#39213f 0%,#170f23 58%,#0f0c17 100%);overflow:hidden}.app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 9px);min-height:360px}.bar{height:64px;min-height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 23px;gap:16px}.brand{font-family:Georgia,serif;font-weight:700;letter-spacing:.17em;font-size:16px;white-space:nowrap}.step{color:#e2c69e;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}.world{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}.aura{pointer-events:none;position:absolute;top:16%;left:12%;width:76%;aspect-ratio:1;border-radius:50%;background:#ad6e9850;filter:blur(65px)}.rail{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.card{position:absolute;width:min(73vw,350px,calc(65dvh * .585));aspect-ratio:.585;border:2px solid #d7ad6f;border-radius:15px;background:#1b1327;box-shadow:0 22px 52px #0009;transform-origin:center;overflow:hidden;pointer-events:none;will-change:transform,opacity;transition:transform .3s cubic-bezier(.17,.78,.25,1),opacity .24s}.face{position:absolute;inset:6px;border:1px solid #d2a467;border-radius:10px;background:repeating-linear-gradient(45deg,#23172e,#23172e 8px,#291b38 8px,#291b38 9px);display:grid;place-items:center;box-shadow:inset 0 0 0 5px #1e1629,inset 0 0 0 7px #9a754c}.face:before{content:"";position:absolute;inset:12% 12%;border:1px solid #d3a96e;border-radius:47%}.face:after{content:"✦     ✧     ✦";position:absolute;bottom:12%;font:14px Georgia,serif;color:#dfbd87;white-space:pre}.sigil{font:clamp(75px,21vw,125px) Georgia,serif;color:#e2b778;line-height:1;text-shadow:0 0 30px #dfaf6480}.instruction{position:absolute;bottom:5px;font-size:12px;color:#c9aec5;pointer-events:none;text-align:center;line-height:1.4;padding:0 10px}.foot{padding:10px 19px 15px;display:flex;flex-direction:column;gap:12px}.chosen{height:36px;display:flex;align-items:center;justify-content:center;gap:5px}.chosen label{font-size:13px;color:#e8ccaf;margin-right:7px}.tiny{width:22px;height:33px;border:1px solid #d4a868;border-radius:3px;background:linear-gradient(135deg,#503659,#24182d);box-shadow:0 3px 7px #0004}.controls{display:flex;gap:10px}.controls button,.again{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;border-radius:14px;padding:15px 12px;min-height:50px;cursor:pointer}.shuffle{flex:1;border:1px solid #ae875c;background:#261c32;color:#edcf9e}.open{flex:1.5;border:0;background:linear-gradient(110deg,#f0cd93,#ae885c);color:#24172c}.open:disabled{opacity:.42}.toast{position:absolute;z-index:8;left:50%;top:76px;transform:translateX(-50%);border-radius:999px;padding:10px 15px;background:#573b62;color:#fff;opacity:0;transition:opacity .2s;font-size:13px;white-space:nowrap;pointer-events:none}.toast.visible{opacity:1}.revealview{display:none;position:absolute;z-index:20;inset:0;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 45%,#39243e,#100d18 80%);padding:calc(env(safe-area-inset-top) + 20px) 0 calc(env(safe-area-inset-bottom) + 15px)}.revealview.show{display:flex}.revealview h1{margin:0;font:29px Georgia,serif}.revealview .sub{margin:9px 0 4px;color:#bca2bf;font-size:12px}.slides{width:100%;flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;gap:16px;align-items:center;padding:10px 13vw 4px;scrollbar-width:none;touch-action:pan-x}.slide{flex:0 0 74vw;max-width:340px;scroll-snap-align:center;display:flex;align-items:center;flex-direction:column;gap:10px;text-align:center}.front{width:100%;aspect-ratio:.59;max-height:64dvh;object-fit:contain;border:2px solid #d6ac76;border-radius:12px;background:#2d1a38;box-shadow:0 18px 48px #000a}.fallback{width:100%;aspect-ratio:.59;max-height:64dvh;border:2px solid #d6ac76;border-radius:12px;background:radial-gradient(ellipse at center,#493253,#201629);display:flex;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:24px;color:#dfbf89;font:22px Georgia,serif}.fallback span{font-size:70px}.slide p{margin:0;font:20px Georgia,serif}.slide small{color:#c3a9b7;letter-spacing:.15em}.again{margin-top:8px;background:#251c32;border:1px solid #ab895d;color:#f3dfbd;padding:12px 20px}.attribution{font-size:9px;color:#947f9c;margin-top:7px}
@media(min-width:650px){.card{width:min(350px,calc(65dvh * .585))}.foot{max-width:620px;width:100%;align-self:center}.slide{flex-basis:330px}}

.rail{perspective:1200px;transform-style:preserve-3d}.card{transition:none!important;backface-visibility:hidden;transform-style:preserve-3d}
</style></head><body><main class="app"><header class="bar"><div class="brand">FORTUNE TELLER</div><div class="step" id="step">1 / 78</div></header><section class="world" id="world" aria-label="Kartları sağa sola kaydır ve seçmek için yukarı sürükle"><div class="aura"></div><div class="rail" id="rail"><div class="card" style="transform:translateX(0) scale(1)"><div class="face"><div class="sigil">✺</div></div></div></div><div class="instruction">← Kartları kaydır · Seçmek için yukarı çek ↑</div></section><footer class="foot"><div class="chosen" id="chosen"><label>Henüz kart seçmedin</label></div><div class="controls"><button type="button" class="shuffle" id="shuffle">⤨ Karıştır</button><button type="button" class="open" id="open" disabled>Kartları Aç ✦</button></div></footer></main><div class="toast" id="toast"></div><div class="revealview" id="revealview"><h1>Senin Kartların</h1><div class="sub">← Kaydırarak kartları keşfet →</div><div class="slides" id="slides"></div><button type="button" class="again" id="again">Yeni Açılım ↻</button><div class="attribution">Rider–Waite–Smith • Pamela Colman Smith, 1909</div></div>
<script>
(()=>{'use strict';
const majors=['The Fool','The Magician','The High Priestess','The Empress','The Emperor','The Hierophant','The Lovers','The Chariot','Strength','The Hermit','Wheel of Fortune','Justice','The Hanged Man','Death','Temperance','The Devil','The Tower','The Star','The Moon','The Sun','Judgement','The World'];
const suits=[['wa','Wands'],['cu','Cups'],['sw','Swords'],['pe','Pentacles']];
const ranks=['Ace','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Page','Knight','Queen','King'];
const URL='https://cdn.jsdelivr.net/gh/sixseeds/tarot-api@main/cards/';
const BACKUP_URLS=['https://raw.githubusercontent.com/sixseeds/tarot-api/main/cards/','https://petaloverflow.github.io/tarot-api/cards/'];
const ALL=[{"name":"The Fool","id":"ar00"},{"name":"The Magician","id":"ar01"},{"name":"The High Priestess","id":"ar02"},{"name":"The Empress","id":"ar03"},{"name":"The Emperor","id":"ar04"},{"name":"The Hierophant","id":"ar05"},{"name":"The Lovers","id":"ar06"},{"name":"The Chariot","id":"ar07"},{"name":"Strength","id":"ar08"},{"name":"The Hermit","id":"ar09"},{"name":"Wheel of Fortune","id":"ar10"},{"name":"Justice","id":"ar11"},{"name":"The Hanged Man","id":"ar12"},{"name":"Death","id":"ar13"},{"name":"Temperance","id":"ar14"},{"name":"The Devil","id":"ar15"},{"name":"The Tower","id":"ar16"},{"name":"The Star","id":"ar17"},{"name":"The Moon","id":"ar18"},{"name":"The Sun","id":"ar19"},{"name":"Judgement","id":"ar20"},{"name":"The World","id":"ar21"},{"name":"Ace of Wands","id":"wa01"},{"name":"Two of Wands","id":"wa02"},{"name":"Three of Wands","id":"wa03"},{"name":"Four of Wands","id":"wa04"},{"name":"Five of Wands","id":"wa05"},{"name":"Six of Wands","id":"wa06"},{"name":"Seven of Wands","id":"wa07"},{"name":"Eight of Wands","id":"wa08"},{"name":"Nine of Wands","id":"wa09"},{"name":"Ten of Wands","id":"wa10"},{"name":"Page of Wands","id":"wa11"},{"name":"Knight of Wands","id":"wa12"},{"name":"Queen of Wands","id":"wa13"},{"name":"King of Wands","id":"wa14"},{"name":"Ace of Cups","id":"cu01"},{"name":"Two of Cups","id":"cu02"},{"name":"Three of Cups","id":"cu03"},{"name":"Four of Cups","id":"cu04"},{"name":"Five of Cups","id":"cu05"},{"name":"Six of Cups","id":"cu06"},{"name":"Seven of Cups","id":"cu07"},{"name":"Eight of Cups","id":"cu08"},{"name":"Nine of Cups","id":"cu09"},{"name":"Ten of Cups","id":"cu10"},{"name":"Page of Cups","id":"cu11"},{"name":"Knight of Cups","id":"cu12"},{"name":"Queen of Cups","id":"cu13"},{"name":"King of Cups","id":"cu14"},{"name":"Ace of Swords","id":"sw01"},{"name":"Two of Swords","id":"sw02"},{"name":"Three of Swords","id":"sw03"},{"name":"Four of Swords","id":"sw04"},{"name":"Five of Swords","id":"sw05"},{"name":"Six of Swords","id":"sw06"},{"name":"Seven of Swords","id":"sw07"},{"name":"Eight of Swords","id":"sw08"},{"name":"Nine of Swords","id":"sw09"},{"name":"Ten of Swords","id":"sw10"},{"name":"Page of Swords","id":"sw11"},{"name":"Knight of Swords","id":"sw12"},{"name":"Queen of Swords","id":"sw13"},{"name":"King of Swords","id":"sw14"},{"name":"Ace of Pentacles","id":"pe01"},{"name":"Two of Pentacles","id":"pe02"},{"name":"Three of Pentacles","id":"pe03"},{"name":"Four of Pentacles","id":"pe04"},{"name":"Five of Pentacles","id":"pe05"},{"name":"Six of Pentacles","id":"pe06"},{"name":"Seven of Pentacles","id":"pe07"},{"name":"Eight of Pentacles","id":"pe08"},{"name":"Nine of Pentacles","id":"pe09"},{"name":"Ten of Pentacles","id":"pe10"},{"name":"Page of Pentacles","id":"pe11"},{"name":"Knight of Pentacles","id":"pe12"},{"name":"Queen of Pentacles","id":"pe13"},{"name":"King of Pentacles","id":"pe14"}];
const el=id=>document.getElementById(id),rail=el('rail'),world=el('world'),step=el('step'),chosen=el('chosen'),open=el('open'),view=el('revealview'),slides=el('slides');
let deck=[],selected=[],position=0,velocity=0,gesture=null,lift=0,wheelTimer=0,toastTimeout;
let frame=0,lastFrame=0,animMode='idle',snapTarget=0,lastCenter=-1,lastTickTime=0,audioContext=null;
const cardNodes=new Map();
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function mix(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext)audioContext=new AC();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});}catch(e){}}
function buzz(){try{navigator.vibrate?.(7)}catch(e){}}
function tick(){const now=performance.now();if(now-lastTickTime<42)return;lastTickTime=now;buzz();if(!audioContext||audioContext.state!=='running')return;try{const t=audioContext.currentTime;const oscillator=audioContext.createOscillator();const gain=audioContext.createGain();oscillator.type='triangle';oscillator.frequency.setValueAtTime(380,t);oscillator.frequency.exponentialRampToValueAtTime(190,t+.023);gain.gain.setValueAtTime(.011,t);gain.gain.exponentialRampToValueAtTime(.0001,t+.032);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(t);oscillator.stop(t+.035);}catch(e){}}
function say(s){const node=el('toast');node.textContent=s;node.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>node.classList.remove('visible'),1300)}
function back(){return '<div class="face"><div class="sigil">✺</div></div>'}
function resetCards(){for(const node of cardNodes.values())node.remove();cardNodes.clear();lastCenter=-1;}
function renderControls(){chosen.replaceChildren();const lbl=document.createElement('label');lbl.textContent=selected.length?'Seçilen: '+selected.length:'Henüz kart seçmedin';chosen.append(lbl);for(let i=0;i<Math.min(selected.length,9);i++){const m=document.createElement('div');m.className='tiny';chosen.append(m)}open.disabled=selected.length===0;open.textContent=selected.length?selected.length+' Kartı Aç ✦':'Kartları Aç ✦'}
function renderCarousel(){
  if(!deck.length){step.textContent='0 / 0';resetCards();return;}
  position=clamp(position,0,deck.length-1);
  const center=Math.round(position);
  if(center!==lastCenter){if(lastCenter>=0)tick();lastCenter=center;step.textContent=(center+1)+' / '+deck.length;}
  const first=Math.max(0,Math.floor(position)-5),last=Math.min(deck.length-1,Math.ceil(position)+5),visible=new Set();
  const gap=clamp(world.clientWidth*.225,68,112);
  for(let i=first;i<=last;i++){
    visible.add(i);
    let c=cardNodes.get(i);
    if(!c){c=document.createElement('div');c.className='card';c.innerHTML=back();rail.append(c);cardNodes.set(i,c)}
    const offset=i-position,dist=Math.abs(offset),lifted=gesture?.mode==='lift'&&i===gesture.focus;
    const x=offset*gap,y=Math.min(128,dist*dist*7)-(lifted?lift*.92:0),z=-Math.min(370,dist*74)+(lifted?105:0);
    const rotateY=clamp(-offset*16,-58,58),rotateZ=clamp(offset*-1.7,-7,7)+(lifted?-.035*lift:0);
    const scale=clamp(1-dist*.08,.71,1)+(lifted?.055:0);
    c.style.transform='translate3d('+x+'px,'+y+'px,'+z+'px) rotateY('+rotateY+'deg) rotateZ('+rotateZ+'deg) scale('+scale+')';
    c.style.opacity=String(clamp(1-dist*.14,.12,1));
    c.style.zIndex=String(100-Math.round(dist*10)+(lifted?150:0));
    c.style.boxShadow=lifted?'0 30px 65px #000b,0 0 32px #d7ae6d65':'';
  }
  for(const [i,node] of cardNodes){if(!visible.has(i)){node.remove();cardNodes.delete(i)}}
}
function stopMotion(){if(frame)cancelAnimationFrame(frame);frame=0;animMode='idle';lastFrame=0;}
function animateMotion(now){
  const dt=lastFrame?clamp(now-lastFrame,1,35):16;lastFrame=now;
  if(animMode==='coast'){
    position=clamp(position+velocity*dt,0,Math.max(0,deck.length-1));
    if(position===0||position===deck.length-1)velocity=0;
    velocity*=Math.exp(-.0065*dt);
    if(Math.abs(velocity)<.0015){animMode='snap';snapTarget=Math.round(position);}
  }else if(animMode==='snap'){
    velocity+=(snapTarget-position)*.00019*dt;
    velocity*=Math.exp(-.025*dt);
    position=clamp(position+velocity*dt,0,Math.max(0,deck.length-1));
    if(Math.abs(snapTarget-position)<.003&&Math.abs(velocity)<.00025){position=snapTarget;velocity=0;animMode='idle';}
  }
  renderCarousel();
  if(animMode!=='idle')frame=requestAnimationFrame(animateMotion);else frame=0;
}
function startMotion(mode){stopMotion();animMode=mode;snapTarget=Math.round(position);frame=requestAnimationFrame(animateMotion)}
function take(){
  if(!deck.length)return;
  stopMotion();const index=Math.round(position),node=cardNodes.get(index);
  let ghost=null,origin='';
  if(node){ghost=node.cloneNode(true);origin=node.style.transform;ghost.style.transform=origin;ghost.style.zIndex='999';ghost.style.opacity='1';ghost.style.boxShadow='0 30px 65px #0009,0 0 32px #d7ae6d65';}
  selected.push(deck.splice(index,1)[0]);position=clamp(index,0,Math.max(0,deck.length-1));velocity=0;lift=0;
  resetCards();renderControls();renderCarousel();
  if(ghost){rail.append(ghost);if(ghost.animate){const animation=ghost.animate([{transform:origin,opacity:1},{transform:origin+' translateY(-180px) scale(.77)',opacity:0}],{duration:410,easing:'cubic-bezier(.18,.75,.2,1)',fill:'forwards'});animation.onfinish=()=>ghost.remove();}else ghost.remove();}
  buzz();say(selected.length+'. kart seçildi ✦');
}
world.addEventListener('pointerdown',e=>{
  if(!deck.length)return;stopMotion();clearTimeout(wheelTimer);velocity=0;unlockAudio();
  gesture={id:e.pointerId,x:e.clientX,y:e.clientY,origin:position,lastPos:position,lastTime:performance.now(),dx:0,dy:0,mode:null,focus:Math.round(position)};
  try{world.setPointerCapture(e.pointerId)}catch(e){}
});
world.addEventListener('pointermove',e=>{
  const g=gesture;if(!g||g.id!==e.pointerId)return;
  g.dx=e.clientX-g.x;g.dy=e.clientY-g.y;
  if(!g.mode){
    if(Math.abs(g.dx)<9&&Math.abs(g.dy)<9)return;
    if(g.dy<0&&Math.abs(g.dy)>Math.abs(g.dx)*1.15)g.mode='lift';
    else if(Math.abs(g.dx)>10&&Math.abs(g.dx)>=Math.abs(g.dy)*.7)g.mode='drag';
    else return;
  }
  if(g.mode==='lift'){lift=clamp(-g.dy,0,240);renderCarousel();return;}
  const gap=clamp(world.clientWidth*.225,68,112),newPos=clamp(g.origin-g.dx/gap,0,Math.max(0,deck.length-1));
  const now=performance.now(),dt=Math.max(4,now-g.lastTime),instant=(newPos-g.lastPos)/dt;
  velocity=clamp(velocity*.35+instant*.65,-.06,.06);
  g.lastPos=newPos;g.lastTime=now;position=newPos;renderCarousel();
});
function endPointer(e,cancelled){const g=gesture;if(!g||g.id!==e.pointerId)return;gesture=null;
  if(!cancelled&&g.mode==='lift'&&g.dy< -80&&Math.abs(g.dy)>Math.abs(g.dx)*.7){take();return;}
  lift=0;
  if(g.mode==='drag'&&!cancelled){const elapsed=performance.now()-g.lastTime;if(elapsed>55)velocity*=Math.exp(-(elapsed-55)/90);velocity=clamp(velocity,-.05,.05);startMotion(Math.abs(velocity)>.0015?'coast':'snap');}
  else{velocity=0;startMotion('snap');}
}
world.addEventListener('pointerup',e=>endPointer(e,false));
world.addEventListener('pointercancel',e=>endPointer(e,true));
world.addEventListener('wheel',e=>{
  e.preventDefault();if(!deck.length)return;clearTimeout(wheelTimer);stopMotion();
  const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  const before=position;position=clamp(position+delta/115,0,deck.length-1);
  velocity=clamp((position-before)*.008,-.045,.045);renderCarousel();
  wheelTimer=setTimeout(()=>startMotion(Math.abs(velocity)>.0015?'coast':'snap'),95);
},{passive:false});
window.addEventListener('resize',renderCarousel);
el('shuffle').addEventListener('click',()=>{stopMotion();clearTimeout(wheelTimer);velocity=0;deck=mix(deck);position=0;resetCards();renderCarousel();buzz();say('Kartlar karıştırıldı ✦')});
function art(card,index){const s=document.createElement('article');s.className='slide';const img=document.createElement('img');img.className='front';img.alt=card.name;img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';let retry=0;img.onerror=()=>{if(retry<BACKUP_URLS.length){img.src=BACKUP_URLS[retry++]+card.id+'.jpg';return;}const fb=document.createElement('div');fb.className='fallback';const sym=document.createElement('span');sym.textContent='✺';const nm=document.createElement('div');nm.textContent='Görsel yüklenemedi: '+card.name;fb.append(sym,nm);img.replaceWith(fb)};img.src=URL+card.id+'.jpg';const small=document.createElement('small');small.textContent=(index+1)+' / '+selected.length;const title=document.createElement('p');title.textContent=card.name;s.append(img,small,title);return s}
open.addEventListener('click',()=>{if(!selected.length)return;slides.replaceChildren();selected.forEach((c,i)=>slides.append(art(c,i)));view.classList.add('show');slides.scrollLeft=0;buzz()});
el('again').addEventListener('click',()=>{stopMotion();selected=[];deck=mix(ALL);position=0;velocity=0;lift=0;resetCards();view.classList.remove('show');renderControls();renderCarousel()});
deck=mix(ALL);renderControls();renderCarousel();
})();
</script></body></html>
